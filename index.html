<!DOCTYPE html>
<html lang="ar" dir="rtl" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة زفاف – شهد وأنس</title>
<meta property="og:title" content="دعوة زفاف انس و شهد">   <!-- عنوان البطاقة في واتساب -->
<meta property="og:description" content="يسعدنا دعوتكم لحضور حفل زفافنا">   <!-- النص تحت العنوان -->
<meta property="og:image" content="https://babqi-wedding.netlify.app/images/envelope.png">   <!-- صورة البطاقة في واتساب (الأفضل JPG أقل من 300KB) -->
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://script.google.com" crossorigin>   <!-- يبدأ الاتصال بجوجل مبكراً -->
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>   <!-- عنوان الرد الفعلي لجوجل -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">   <!-- خطوط Amiri و Tajawal (احذفيه إذا تستخدمين خطوطك فقط) -->

<style>
/* =====================================================================
   التصميم (STYLES)
   - الألوان كلها في الأعلى تحت :root، غيّري هناك فقط.
   - الصور تتحدد من قسم الإعدادات في الأسفل (IMAGES و PAGES)، مو من هنا.
   ===================================================================== */
:root {
  --bg:    #faf7f2;  /* لون الخلفية العامة (يظهر إذا الصورة ما انحطت) */
  --bg2:   #f3ede2;  /* لون خلفية القسم الأخير                          */
  --card:  #ffffff;
  --ink:   #DABDBE;  /* لون الكتابة الأساسي                              */
  --mute:  #7a756c;  /* لون الكتابة الباهتة                              */
  --gold:  #A66166;  /* اللون المميز: الخطوط والأوقات وزر الاعتذار     */
  --sage:  #757C5A;  /* لون زر "سأحضر"                                  */
  --line:  #e8e1d4;  /* الحدود الرفيعة                                  */
  --cover-text: #A66166;  /* لون كتابة صفحة الظرف                       */
  --layer-fit: fill;        /* عرض صور الطبقات: "fill" تملأ الصفحة كاملة | "contain" كاملة بدون تمدد | "cover" مع قص الأطراف */
  --space-top:    110px;    /* مسافة بين أعلى القسم والكتابة */
  --space-bottom: 110px;    /* مسافة بين أسفل القسم والكتابة */
  --small-flower-width: 90px; /* عرض الوردة الصغيرة تحت الأسماء */
  --peek: 40px;             /* مقدار ظهور الصفحة التالية أسفل الشاشة (اكتبي 0px لإلغائه) */
}
@media (prefers-color-scheme: dark) {  /* ألوان الجوالات بالوضع الليلي */
  :root { --bg:#171613; --bg2:#1d1b17; --card:#211f1b; --ink:#DABDBE; --mute:#a39c8e; --gold:#A66166; --sage:#8fa691; --line:#37332b; }
}

/* ---------- خطوطك الخاصة ----------
   ضعي ملف الخط في مجلد fonts باسم title (العناوين) و/أو body (النصوص). الصيغ: ttf أو otf أو woff أو woff2 */
@font-face { font-family: "MyDisplay"; font-display: swap;
  src: url("fonts/title.woff2") format("woff2"), url("fonts/title.woff") format("woff"), url("fonts/title.ttf") format("truetype"), url("fonts/title.otf") format("opentype"); }
@font-face { font-family: "MyBody"; font-display: swap;
  src: url("fonts/body.woff2") format("woff2"), url("fonts/body.woff") format("woff"), url("fonts/body.ttf") format("truetype"), url("fonts/body.otf") format("opentype"); }
:root {
  --font-display: "MyDisplay", Amiri, Georgia, serif;              /* خط العناوين والأسماء والأرقام */
  --font-body:    "MyBody", Tajawal, system-ui, sans-serif;        /* خط الكتابة العادية */
}

/* ---------- أساسيات ---------- */
* { box-sizing: border-box; }                                       /* الحدود والمسافات داخل حجم العنصر */
html { scroll-behavior: smooth; scroll-snap-type: y proximity; }    /* تمرير ناعم بين الأقسام */
html.locked, html.locked body { overflow: hidden; height: 100%; }   /* يمنع التمرير قبل فتح الظرف */
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-weight: 300; line-height: 1.9; }
h1, h2, .serif { font-family: var(--font-display); font-weight: 400; }   /* خط العناوين */

/* ---------- القسم: كل صفحة تملأ الشاشة (ناقص --peek ليظهر طرف التالية) ---------- */
.section { scroll-snap-align: start; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.section:not(.thin) { height: calc(100svh - var(--peek)); min-height: 0;                                            /* الصفحة بحجم ثابت ولا تتمدد */
  padding: min(var(--space-top), 8svh) 24px min(var(--space-bottom), 8svh); }                                       /* المسافات تصغر تلقائياً في الجوالات القصيرة */
.section.thin { min-height: auto; padding: 34px 20px; scroll-snap-align: none; }                                    /* القسم النحيف (العدّ التنازلي والأخير) */

/* ---------- عناصر صغيرة مشتركة ---------- */
.label   { font-size: 13px; color: var(--gold); }                   /* العنوان الصغير فوق العناوين */
.muted   { color: var(--mute); }
.divider { width: 60px; height: 1px; background: var(--gold); margin: 20px auto; }   /* الخط الفاصل */
h2       { font-size: clamp(34px, 9vw, 46px); margin: 6px 0 4px; }  /* حجم العناوين */
.small   { font-size: 14px; color: var(--mute); margin-top: 16px; }
.link    { color: var(--gold); cursor: pointer; text-decoration: underline; background: none; border: 0; font: inherit; padding: 0; }

/* =====================================================================
   صفحة الظرف (الغلاف)
   ===================================================================== */
.cover { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
         justify-content: space-between; text-align: center; padding: 7vh 24px 6vh; overflow: hidden;
         background: var(--bg);                                      /* الصور تأتي من الطبقات (PAGES) */
         transition: transform 1.1s cubic-bezier(.7,0,.2,1), opacity 1.1s; }
.cover.is-opening { transform: translateY(-100%); opacity: 0; }      /* حركة فتح الدعوة */
.cover.is-opening .envelope { transform: scale(1.15); }

.inviter       { opacity: 0; }                                       /* اسم الداعي مخفي حتى يصل (من الرابط أو الشيت) */
.inviter.show  { opacity: 1; animation: fadeUp .5s both; }           /* ثم يظهر خلال نصف ثانية */
.inviter-name  { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--cover-text); line-height: 1.5; }
.inviter-line  { font-size: 16px; color: var(--mute); }              /* عبارة قبل وبعد الاسم */

.envelope { position: relative; width: min(70vw, 700px); aspect-ratio: 4 / 3; cursor: pointer;     /* مساحة صورة الظرف */
            background: var(--img-envelope, none) center / contain no-repeat;
            display: flex; align-items: center; justify-content: center; transition: transform 1.1s ease; }

.open-hint { border: 0; background: none; padding: 0; cursor: pointer; color: var(--cover-text); opacity: 0; font: 300 12px var(--font-body); }   /* عبارة اضغط لفتح الدعوة: مخفية حتى يظهر الاسم */
.cover.ready .open-hint { opacity: .7; animation: fadeUp .6s .5s both; }   /* تظهر بعد الاسم بنصف ثانية */

@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }   /* حركة ظهور من تحت لفوق */

/* =====================================================================
   القسم 1: الدعوة + التأكيد
   ===================================================================== */
.bismillah  { font-family: var(--font-display); font-size: 20px; color: var(--gold); }
.dear       { font-size: 17px; color: var(--mute); margin-top: 18px; }
.guest-name { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 9vw, 44px); line-height: 1.3; }
.lead       { font-size: 16px; color: var(--mute); max-width: 400px; margin: 0 auto; }
h1          { font-size: clamp(50px, 14vw, 80px); line-height: 1.2; margin: 6px 0 0; }     /* أسماء العرسان */
h1 em       { color: var(--gold); font-style: normal; font-size: .5em; padding: 0 .3em; }  /* الحرف بين الاسمين */
.date       { font-size: 26px; font-family: var(--font-display); }

.buttons  { display: grid; gap: 6px; margin: 14px auto 0; max-width: 190px; width: 100%; }   /* عرض الزرّين: صغّري الرقم لتصغيرهما */
.btn      { border: 1px solid var(--gold); color: var(--ink); background: transparent; padding: 8px 14px; border-radius: 99px; font: 500 13px var(--font-body); cursor: pointer; }   /* حجم الزر والخط */
.btn-yes  { background: var(--sage); border-color: var(--sage); color: #fff; }   /* زر الحضور */
.btn-no   { background: var(--gold); border-color: var(--gold); color: #fff; }   /* زر الاعتذار: ملوّن */
.btn:disabled { opacity: .5; }
.seats    { display: inline-block; margin-top: 8px; font-size: 14px; color: var(--gold); }
.result   { font-size: 30px; margin-top: 8px; }

.qr-box   { margin-top: 4px; }                                                   /* منطقة صورة الكود */
.qr-box img { width: 100px; max-width: 33vw; padding: 0; border: 0; border-radius: 0; }   /* صورة الكود */
.qr-note  { max-width: 380px; margin: 4px auto 0; font-size: 13px; color: var(--mute); }  /* الجملة تحت الكود */

.section > .scroll-hint { position: absolute; bottom: 12px; left: 0; right: 0; margin: 0 auto; width: 34px; height: 34px;
  color: var(--ink); opacity: .85; animation: bob 2s ease-in-out infinite; }     /* سهم يدل على وجود صفحات تحت */
.scroll-hint svg { width: 100%; height: 100%; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }   /* حركة السهم */

/* =====================================================================
   القسم 2: العدّ التنازلي (نحيف)
   ===================================================================== */
#countdown  { background: #343824; }                                              /* لون خلفية العدّ */
.count-row  { display: flex; gap: 14px; justify-content: center; margin-top: 8px; }
.count-item { min-width: 62px; }
.count-num  { display: block; font-family: var(--font-display); font-size: 36px; line-height: 1.2; }
.count-lbl  { font-size: 13px; opacity: .85; }

/* =====================================================================
   القسم 3: مراسم الحفل
   ===================================================================== */
.timeline  { max-width: 420px; width: 100%; margin: 24px auto 8px; text-align: right; }
.event     { display: grid; grid-template-columns: 110px 1fr; gap: 14px; }       /* 110px = عرض عمود الوقت */
.event-time  { font-family: var(--font-display); font-size: 24px; color: var(--gold); line-height: 1.5; }   /* حجم خط الوقت */
.event-body  { border-inline-start: 1px solid var(--gold); padding-inline-start: 22px; padding-bottom: 30px; position: relative; }
.event-body::before { content: ""; position: absolute; inset-inline-start: -6px; top: 9px; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); }   /* النقطة الذهبية */
.event:last-child .event-body { padding-bottom: 0; border-color: transparent; }
.event-title { display: block; font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.5; }
.event-text  { font-size: 15px; opacity: .85; }
.venue       { margin-top: 20px; }
.venue strong { display: block; font-weight: 500; }
.pill        { display: inline-block; margin-top: 12px; border: 1px solid var(--gold); color: inherit; padding: 9px 26px; border-radius: 99px; text-decoration: none; font-size: 15px; }   /* زر الموقع */
.section > .notices { display: flex; justify-content: center; gap: 30px; margin-top: auto; padding-top: 18px; }   /* الملاحظات في أسفل الصفحة */
.notice { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 120px; font-size: 13px; line-height: 1.5; opacity: .9; }   /* أيقونة فوق النص */
.notice svg { width: 28px; height: 28px; }                                       /* حجم الأيقونة */

/* =====================================================================
   القسم 4: الرسالة الأخيرة (نحيف)
   ===================================================================== */
#closing       { background: var(--bg2); padding: 24px 20px; }                   /* لون خلفية الرسالة الأخيرة */
.closing-text  { max-width: 420px; font-size: 19px; line-height: 2.1; }
.closing-names { font-family: var(--font-display); font-size: 28px; color: var(--gold); margin-top: 10px; }
.small-flower  { display: block; width: var(--small-flower-width); margin: 10px auto 0; }   /* الوردة الصغيرة */

/* =====================================================================
   التنقل (النقاط الجانبية) + طبقات الصور + الحركة
   ===================================================================== */
.dots   { position: fixed; left: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 5; }
.dots a { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--gold); background: rgba(255,255,255,.4); transition: .3s; }
.dots a.active { background: var(--gold); transform: scale(1.3); }               /* النقطة الحالية */

/* طبقات الصور: حتى 4 لكل صفحة (1 الأسفل ... 4 الأعلى)، والكتابة فوقها كلها */
.layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: var(--layer-fit);
         pointer-events: none; opacity: 0; transition: opacity 1.2s ease, transform 1.2s ease; }   /* مخفية ثم تظهر بنعومة */
.layer[data-from="top"]    { transform: translateY(-40px); }                     /* تدخل من فوق */
.layer[data-from="bottom"] { transform: translateY(40px); }                      /* تدخل من تحت */
.layer[data-from="left"]   { transform: translateX(-40px); }                     /* تدخل من اليسار */
.layer[data-from="right"]  { transform: translateX(40px); }                      /* تدخل من اليمين */
.section.visible > .layer, .cover.visible > .layer { opacity: 1; transform: none; }   /* تظهر مع ظهور الصفحة */
.section::before, .cover::before { content: ""; position: absolute; inset: 0; background: #1e1f1f; opacity: var(--overlay, 0); z-index: 15; pointer-events: none; }   /* تعتيم فوق الطبقة 1 (من 0 إلى 1) */
.section > :not(.layer), .cover > :not(.layer) { position: relative; z-index: 50; }   /* الكتابة فوق كل الطبقات */

.reveal { opacity: 0; transform: translateY(22px); transition: opacity .9s ease, transform .9s ease; transition-delay: calc(var(--order, 0) * .14s); }   /* عنصر يظهر بحركة (--order يأخّره) */
.section.visible .reveal { opacity: 1; transform: none; }
.fade-in { animation: fadeUp .8s ease both; }
@media (prefers-reduced-motion: reduce) {                                        /* لمن يفضّل بدون حركات */
  html { scroll-behavior: auto; } .reveal { opacity: 1; transform: none; transition: none; }
  .cover *, .cover { animation: none !important; }
  .layer { opacity: 1 !important; transform: none !important; transition: none !important; }
}
</style>
</head>

<body>

<!-- صفحة الظرف: أول شي يظهر -->
<div class="cover" id="cover">
  <div class="inviter" id="inviter"></div>                 <!-- اسم الداعي والعبارة -->
  <div class="envelope" id="envelope" role="button" tabindex="0"></div>   <!-- صورة الظرف (الضغط عليها يفتح الدعوة) -->
  <button class="open-hint" id="openHint"></button>        <!-- عبارة اضغط لفتح الدعوة -->
</div>

<!-- النقاط الجانبية -->
<nav class="dots" id="dots">
  <a href="#invitation"></a><a href="#countdown"></a><a href="#program"></a><a href="#closing"></a>
</nav>

<!-- 1) الدعوة: اسم المدعو ثم تأكيد الحضور (+ الكود إذا حضر) -->
<section class="section" id="invitation">
  <div class="bismillah reveal" id="bismillah"></div>
  <div class="reveal" style="--order:1" id="greeting"></div>
  <p class="lead reveal" style="--order:2" id="leadText"></p>
  <h1 class="reveal" style="--order:3" id="coupleNames"></h1>
  <div class="date reveal" style="--order:4" id="weddingDate"></div>
  <div class="divider reveal" style="--order:5"></div>
  <h2 class="reveal" style="--order:5" id="replyTitle"></h2>
  <div class="reveal" style="--order:6; width:100%" id="replyBox"></div>
  <a class="scroll-hint" href="#countdown" aria-label="التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></a>   <!-- سهم التمرير -->
</section>

<!-- 2) العدّ التنازلي (قسم نحيف) -->
<section class="section thin" id="countdown">
  <div class="label reveal" id="countdownLabel"></div>
  <div class="count-row reveal" style="--order:1" id="countdownRow"></div>
</section>

<!-- 3) مراسم الحفل -->
<section class="section" id="program">
  <div class="label reveal" id="programLabel"></div>
  <h2 class="reveal" style="--order:1" id="programTitle"></h2>
  <div class="divider reveal" style="--order:2"></div>
  <div class="timeline" id="timeline"></div>
  <div class="venue reveal" style="--order:6" id="venue"></div>
  <div class="notices reveal" style="--order:7" id="notices"></div>   <!-- الملاحظات أسفل الصفحة (أيقونة + نص) -->
</section>

<!-- 4) الرسالة الأخيرة (تتغير حسب رد الضيف) -->
<section class="section thin" id="closing">
  <p class="closing-text reveal" id="closingText"></p>
  <div class="closing-names reveal" style="--order:1" id="closingNames"></div>   <!-- أسماء العرسان -->
  <img class="small-flower reveal" style="--order:2" id="smallFlower" alt="" onerror="this.style.display='none'">   <!-- الوردة الصغيرة -->
  <div class="brand reveal" style="--order:3">arhbo.invite</div>   <!-- اسم العلامة التجارية -->
</section>


<script>
/* =====================================================================
   1) الإعدادات (SETTINGS)  ← هذا الجزء الوحيد اللي تحتاجين تعدّلينه
   ===================================================================== */

// ---- صور أخرى ----
const IMAGES = {
  envelope: "images/envelope.png",   // رسمة الظرف (يفضل PNG شفاف)
  qr:       "images/QR.png",         // صورة الكود (نفس الصورة لكل الضيوف)
};
const SMALL_FLOWER = "images/flower-small.png";   // وردة صغيرة تحت الأسماء في آخر صفحة (اتركيها "" لإخفائها)

// ---- طبقات الصور: لكل صفحة حتى 4 طبقات، وكل صفحة لها صورها الخاصة ----
// layers: الطبقة الأولى هي الأسفل (الخلفية) والرابعة هي الأعلى. اتركي "" لطبقة فاضية.
//   مثال عادي:      "images/page1-layer2.png"
//   مثال بحركة:     { src: "images/flowers.png", from: "top" }   (from: top أو bottom أو left أو right)
// overlay: تعتيم فوق الطبقة الأولى فقط (0 = بدون، 1 = أسود كامل)
// textColor: لون كتابة الصفحة ("" = اللون العادي)
const PAGES = {
  cover: {                                   // صفحة الظرف
    layers: ["", "", "", ""],
    overlay: 1, textColor: "",
  },
  invitation: {                              // الدعوة والتأكيد
    layers: ["images/greenbackground.png", "images/leaves.png", "images/Flowers.png", ""],
    overlay: 0, textColor: "",
  },
  countdown: {                               // العدّ التنازلي (صفحة نحيفة)
    layers: ["", "", "", ""],
    overlay: 0, textColor: "#ffffff",
  },
  program: {                                 // مراسم الحفل
    layers: ["images/greenbackground.png", "", "images/image copy.png", ""],
    overlay: 0, textColor: "#ffffff",
  },
  closing: {                                 // الرسالة الأخيرة
    layers: ["", "", "", ""],
    overlay: 0, textColor: "",
  },
};

// ---- الداعي: يُستخدم فقط كنص احتياطي، والأصل يأتي من الشيت ----
const INVITER = {
  before: "تتشرف",                                    // عبارة قبل الاسم
  name:   "السيدة ابتسام سعيد حكيمة",                 // اسم الداعي
  after:  "لدعوتكم لحضور حفل زفاف ابنها أنس بابقي",   // عبارة بعد الاسم
};

// ---- العرسان والتاريخ والمكان ----
const WEDDING = {
  bride:    "انس",
  groom:    "شهد",
  joiner:   "و",                                      // الحرف بين الاسمين (اتركيه "" لحذفه)
  date:     "السبت ٢٦ ديسمبر ٢٠٢٦",                   // التاريخ كما يظهر للضيف
  dateTime: "2026-12-26T21:00:00+03:00",              // موعد العدّ التنازلي (السنة-الشهر-اليوم T الساعة، بتوقيت الرياض +03:00)
  venue:    "قاعة لافيورا للمناسبات",
  city:     "الرياض",
  mapUrl:   "https://share.google/CuyT0vH0xXBNzKlj7", // اتركيه "" لإخفاء زر الموقع
};

// ---- مراسم الحفل: أضيفي سطر أو احذفي أو غيّري الترتيب ----
const PROGRAM = [
  { time: "٩:٠٠ مساءً",  title: "استقبال الضيوف", text: "يسعدنا استقبالكم وتشريفكم" },
  { time: "١٢:٠٠ مساءً", title: "زفة العروس",    text: "زفة العروس وأجمل اللحظات" },
  { time: "١:٣٠ صباحا", title: "العشاء",         text: "مأدبة عشاء على شرفكم" },
];

// ---- ملاحظات أسفل صفحة المراسم (أيقونة + نص): غيّري النص أو احذفي سطراً. icon: "kids" أو "camera" ----
const NOTICES = [
  { icon: "kids",   text: "جنة الأطفال منازلهم" },
  { icon: "camera", text: "يمنع التصوير" },
];

// ---- كل الكلام الظاهر في الصفحة ----
const TEXT = {
  // الغلاف
  openHint:     "اضغط لفتح الدعوة",
  // قسم الدعوة
  bismillah:    "بسم الله الرحمن الرحيم",
  dearGuest:    "دعوة خاصة إلى",
  welcome:      "لمن كان وصالهم عزيزًا على قلوبنا",
  lead:         " نتشرف بدعوتكم لحفل زفاف",
  replyTitle:   "تأكيد الحضور",
  yesButton:    "سأحضر بإذن الله",
  noButton:     "أعتذر عن الحضور",
  thanksNo:     "سنفتقدك",
  thankYou:     "شكراً لإبلاغنا.",
  change:       "تغيير الرد",
  seats:        n => `الدعوة تشمل ${toArabicDigits(n)} أشخاص`,
  // الكود (يظهر فقط لمن اختار الحضور)
  qrNote:       " أظهري الكود عند الدخول.",
  // العدّ التنازلي
  countdownLabel: "متبقي على الزفاف",
  countdownDone:  "اليوم هو يوم الزفاف! 🤍",
  units:          ["يوم", "ساعة", "دقيقة", "ثانية"],
  // مراسم الحفل
  programLabel: "ليلة الفرح",
  programTitle: "مراسم الحفل",
  mapButton:    "عرض الموقع",
  // الرسالة الأخيرة
  closingWaiting:  "نتشرف بحضوركم وننتظركم بكل شوق.",                          // لمن حضر أو لم يرد بعد
  closingDeclined: " حزينين لأنكم ما راح تكونون معنا، ونتمنى لكم كل الخير.",    // لمن اعتذر
  // رسائل الأخطاء
  needLink: "فضلاً افتح رابط دعوتك الخاصة لتأكيد الحضور.",
  notFound: "لم نجد هذه الدعوة، تأكد من الرابط.",
  tryLater: "حاول مرة أخرى بعد قليل.",
  error:    "عذراً، حدث خطأ. حاول مرة أخرى.",
};

// ---- رابط Google Apps Script (ينتهي بـ /exec) ----
const API_URL = "https://script.google.com/macros/s/AKfycbwLVsGx_XKoX6-gpX8ZQfHsW0sNmbdOwmdNVDSKmUSaojWus9yc85XPPJokHJE-6huc/exec";

// ---- الكلمات المحفوظة في الشيت (لازم تطابق Code.gs) ----
const STATUS_YES = ["حاضر", "Attending"];
const STATUS_NO  = ["معتذر", "Declined"];


/* =====================================================================
   2) أدوات صغيرة (HELPERS) — لا تحتاجين تعدّلينها
   ===================================================================== */
const $ = id => document.getElementById(id);                  // اختصار لإيجاد عنصر بالـ id

const ICONS = {   // الأيقونات الجاهزة للملاحظات
  kids:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="2.6"/><path d="M8 20v-4a4 4 0 0 1 8 0v4"/><path d="M3 3l18 18"/></svg>`,
  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/><path d="M3 3l18 18"/></svg>`,
};

function toArabicDigits(n) {                                  // يحوّل 123 إلى ١٢٣
  return String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
}
function safe(text) {                                         // يجعل النص آمن داخل HTML
  return String(text ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
const guestCode = new URLSearchParams(location.search).get("g") || "";    // رمز الضيف من الرابط ?g=...
const urlInviter = new URLSearchParams(location.search).get("i") || "";   // اسم الداعي من الرابط ?i=... (يظهر فوراً)


/* =====================================================================
   3) تعبئة الصفحة بالنصوص والصور
   ===================================================================== */
function buildPage() {
  for (const [name, file] of Object.entries(IMAGES)) {        // الصور تتحول إلى متغيرات CSS (--img-envelope ...)
    document.documentElement.style.setProperty(`--img-${name}`, `url("${file}")`);
  }

  $("openHint").textContent = TEXT.openHint;                  // عبارة تحت الظرف

  // الطبقات: لكل صفحة في PAGES ننشئ صور الطبقات (حتى 4) ونرتبها بحسب رقمها
  for (const [pageId, page] of Object.entries(PAGES)) {
    const el = $(pageId);                                     // عنصر الصفحة
    if (!el) continue;                                        // غير موجود: نتجاهله
    el.style.setProperty("--overlay", page.overlay || 0);     // قوة التعتيم
    if (page.textColor) el.style.color = page.textColor;      // لون الكتابة إن حددتيه
    page.layers.slice(0, 4).forEach((layer, i) => {           // أول 4 طبقات فقط
      const src = typeof layer === "object" ? layer.src : layer;   // مسار الصورة (نص أو داخل كائن)
      if (!src) return;                                       // طبقة فاضية: نتجاهلها
      const img = document.createElement("img");              // ننشئ عنصر صورة
      img.className = "layer";                                // شكله من CSS (.layer)
      img.dataset.from = (typeof layer === "object" && layer.from) || "fade";   // اتجاه الدخول (أو ظهور هادئ)
      img.style.zIndex = (i + 1) * 10;                        // ترتيب الطبقة: 10، 20، 30، 40
      img.src = src; img.alt = "";                            // المسار ونص بديل فاضي (زينة)
      img.onerror = () => img.remove();                       // لو الملف غير موجود: نحذف الطبقة
      el.prepend(img);                                        // نضعها داخل الصفحة
    });
  }
  if (SMALL_FLOWER) $("smallFlower").src = SMALL_FLOWER; else $("smallFlower").style.display = "none";   // الوردة الصغيرة
  setTimeout(() => $("cover").classList.add("visible"), 150); // يشغّل ظهور طبقات صفحة الظرف

  // قسم الدعوة
  $("bismillah").textContent   = TEXT.bismillah;
  $("leadText").textContent    = TEXT.lead;
  $("coupleNames").innerHTML   = `${safe(WEDDING.bride)}<em>${safe(WEDDING.joiner)}</em>${safe(WEDDING.groom)}`;
  $("weddingDate").textContent = WEDDING.date;
  $("replyTitle").textContent  = TEXT.replyTitle;

  // العدّ التنازلي + المراسم
  $("countdownLabel").textContent = TEXT.countdownLabel;
  $("programLabel").textContent   = TEXT.programLabel;
  $("programTitle").textContent   = TEXT.programTitle;

  $("timeline").innerHTML = PROGRAM.map((item, i) => `
    <div class="event reveal" style="--order:${i + 3}">
      <div class="event-time">${safe(item.time)}</div>
      <div class="event-body"><span class="event-title">${safe(item.title)}</span><span class="event-text">${safe(item.text)}</span></div>
    </div>`).join("");

  const place = WEDDING.venue + (WEDDING.city ? "، " + WEDDING.city : "");   // اسم القاعة والمدينة
  const map   = WEDDING.mapUrl ? `<a class="pill" href="${safe(WEDDING.mapUrl)}" target="_blank" rel="noopener">${TEXT.mapButton}</a>` : "";   // زر الموقع
  $("venue").innerHTML = `<strong>${safe(place)}</strong>${map}`;

  $("notices").innerHTML = NOTICES.map(n => `<div class="notice">${ICONS[n.icon] || ""}<span>${safe(n.text)}</span></div>`).join("");   // الملاحظات أسفل المراسم

  $("closingNames").textContent = `${WEDDING.bride} ${WEDDING.joiner} ${WEDDING.groom}`;   // أسماء الرسالة الأخيرة
}


/* =====================================================================
   4) فتح الظرف
   ===================================================================== */
function openInvitation() {
  if (!$("cover").classList.contains("ready")) return;        // لا نفتح الظرف قبل ظهور اسم الداعي
  $("cover").classList.add("is-opening");                     // تشغيل حركة الفتح
  setTimeout(() => {
    $("cover").hidden = true;                                 // إخفاء الغلاف نهائياً
    document.documentElement.classList.remove("locked");      // السماح بالتمرير
    window.scrollTo(0, 0);
    startScrollEffects();                                     // تشغيل حركة ظهور الأقسام
  }, 1000);
}
function setupCover() {
  ["envelope", "openHint"].forEach(id => $(id).onclick = openInvitation);          // الضغط على الظرف أو العبارة
  $("envelope").onkeydown = e => { if (e.key === "Enter" || e.key === " ") openInvitation(); };
}


/* =====================================================================
   5) الداعي والضيف: الأسماء، الأزرار، الكود، الرسالة الأخيرة
   ===================================================================== */
let inviterFromSheet = false;                                 // هل وصل اسم الداعي من الشيت؟
function showInviter(inv, fromSheet = true) {                 // inv = عبارات الداعي | fromSheet=false = قادم من الرابط (مؤقت)
  if (inviterFromSheet) return;                               // اسم الشيت ظهر: لا نغيّره
  if (!inv && $("inviter").classList.contains("show")) return;   // لا شيء جديد وهناك اسم ظاهر: نتركه
  if (fromSheet && inv && (inv.name || inv.before || inv.after)) inviterFromSheet = true;   // وصلنا بيانات الشيت
  const x = inv || {};                                        // أي حقل فاضي يأخذ الافتراضي من INVITER
  $("inviter").innerHTML = `<div class="inviter-line">${safe(x.before || INVITER.before)}</div>
    <div class="inviter-name">${safe(x.name || INVITER.name)}</div><div class="inviter-line">${safe(x.after || INVITER.after)}</div>`;
  $("inviter").classList.add("show");                         // يظهر الاسم
  $("cover").classList.add("ready");                          // ويسمح بفتح الظرف
}
if (urlInviter) showInviter({ name: urlInviter }, false);     // يظهر فوراً من الرابط
setTimeout(() => showInviter(), 4000);                        // لو ما فيه اسم بالرابط وتأخر الشيت: الاسم الافتراضي

function showGreeting(guest) {                                // اسم المدعو أعلى الدعوة
  $("greeting").innerHTML = guest
    ? `<div class="dear">${TEXT.dearGuest}</div><div class="guest-name" dir="auto">${safe(guest.name)}</div>`
    : `<div class="dear">${TEXT.welcome}</div>`;
}

function qrBlock() {                                          // الكود والجملة تحته فقط
  return `<div class="qr-box">
    <img src="${IMAGES.qr}" alt="" onerror="this.style.display='none'">
    <p class="qr-note">${TEXT.qrNote}</p></div>`;
}

function showClosing(status) {                                // الرسالة الأخيرة حسب حالة الضيف
  $("closingText").textContent = STATUS_NO.includes(status) ? TEXT.closingDeclined : TEXT.closingWaiting;
}

function showReply(guest, message) {                          // يرسم قسم التأكيد حسب حالة الضيف
  const box = $("replyBox");
  showClosing(guest && guest.status);
  if (!guest) { box.innerHTML = `<p class="small">${safe(message || TEXT.needLink)}</p>`; return; }   // رابط غير صحيح
  const seats = guest.seats > 1 ? `<div class="seats">${TEXT.seats(guest.seats)}</div>` : "";         // عدد الأشخاص

  if (STATUS_YES.includes(guest.status)) {                    // حضر: الكود وجملته فقط
    box.innerHTML = `<div class="fade-in">${qrBlock()}</div>`;
  } else if (STATUS_NO.includes(guest.status)) {              // اعتذر
    box.innerHTML = `<div class="fade-in"><div class="serif result">${TEXT.thanksNo}</div>
      <p class="small">${TEXT.thankYou} <button class="link" id="changeBtn">${TEXT.change}</button></p></div>`;
  } else {                                                    // لسا ما رد: الزرّان
    box.innerHTML = `${seats}<div class="buttons">
        <button class="btn btn-yes" data-answer="yes">${TEXT.yesButton}</button>
        <button class="btn btn-no"  data-answer="no">${TEXT.noButton}</button></div>`;
  }
  box.querySelectorAll("[data-answer]").forEach(b => b.onclick = () => sendAnswer(guest, b.dataset.answer));   // ربط الزرّين
  const change = $("changeBtn");                              // رابط تغيير الرد (للمعتذر)
  if (change) change.onclick = () => showReply({ ...guest, status: "Pending" });
}

async function sendAnswer(guest, answer) {                    // يرسل الرد إلى Google Sheet
  const box = $("replyBox");
  box.querySelectorAll("button").forEach(b => b.disabled = true);   // تعطيل الأزرار أثناء الإرسال
  try {
    const data = await (await fetch(`${API_URL}?action=reply&g=${encodeURIComponent(guestCode)}&r=${answer}`)).json();
    if (!data.ok) throw new Error("rejected");                // الشيت رفض الطلب
    showReply({ ...guest, status: data.status });             // عرض الحالة الجديدة
  } catch (err) {
    box.insertAdjacentHTML("beforeend", `<p class="small">${TEXT.error}</p>`);   // رسالة خطأ
    box.querySelectorAll("button").forEach(b => b.disabled = false);             // إعادة تفعيل الأزرار
  }
}

async function loadGuest() {                                  // يبحث عن الضيف في الشيت برمزه
  showGreeting(null);
  if (!guestCode) {                                           // رابط عام بدون رمز: نجلب عبارات الداعي فقط
    showReply(null);
    try { const s = await (await fetch(`${API_URL}?action=settings`)).json(); showInviter(s.inviter); } catch (e) { showInviter(); }
    return;
  }
  try {
    const data = await (await fetch(`${API_URL}?action=get&g=${encodeURIComponent(guestCode)}`)).json();
    if (data.ok) { showGreeting(data); showReply(data); showInviter(data.inviter); }   // الضيف موجود
    else { showReply(null, TEXT.notFound); showInviter(); }                           // رمز غير موجود
  } catch (err) { showReply(null, TEXT.tryLater); showInviter(); }                    // مشكلة اتصال
}


/* =====================================================================
   6) العدّ التنازلي
   ===================================================================== */
function updateCountdown() {
  const diff = new Date(WEDDING.dateTime) - new Date();       // الفرق بالملي ثانية
  if (diff <= 0) { $("countdownRow").textContent = TEXT.countdownDone; return; }   // الموعد جاء
  const s = Math.floor(diff / 1000);                          // الفرق بالثواني
  const values = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];   // أيام، ساعات، دقائق، ثواني
  $("countdownRow").innerHTML = values.map((v, i) =>
    `<div class="count-item"><span class="count-num">${toArabicDigits(v)}</span><span class="count-lbl">${TEXT.units[i]}</span></div>`).join("");
}


/* =====================================================================
   7) التمرير السلس والحركة
   ===================================================================== */
function startScrollEffects() {
  const dots = [...document.querySelectorAll("#dots a")];     // النقاط الجانبية
  dots.forEach(dot => dot.onclick = e => { e.preventDefault(); document.querySelector(dot.getAttribute("href")).scrollIntoView({ behavior: "smooth" }); });

  // لما يظهر قسم على الشاشة: تظهر عناصره بحركة وتتفعّل نقطته
  const watcher = new IntersectionObserver(entries => entries.forEach(entry => {
    if (!entry.isIntersecting) return;                        // تجاهل القسم غير الظاهر
    entry.target.classList.add("visible");                    // تفعيل ظهور القسم
    dots.forEach(d => d.classList.toggle("active", d.getAttribute("href") === "#" + entry.target.id));   // تفعيل النقطة الحالية
  }), { threshold: 0.2 });
  document.querySelectorAll(".section").forEach(s => watcher.observe(s));   // مراقبة كل الأقسام
}


/* =====================================================================
   8) التشغيل
   ===================================================================== */
buildPage();                          // 1) عبّي الصفحة
setupCover();                         // 2) فعّل الظرف
loadGuest();                          // 3) اجلب بيانات الضيف من الشيت
updateCountdown();                    // 4) شغّل العدّ التنازلي
setInterval(updateCountdown, 1000);   // تحديث العدّ كل ثانية
</script>
</body>
</html>
